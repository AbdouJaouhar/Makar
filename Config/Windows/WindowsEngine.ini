[/Script/Engine.RendererSettings]
; Nanite foliage: the baked plants (Scripts/bake_flora.py) are simplified into voxels in the distance instead of
; thinning out. Here rather than in DefaultEngine.ini, which is kept out of the repository.
r.Nanite.AllowVoxels=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Nanite (the baked flora) needs Shader Model 6: on SM5 the engine draws every Nanite mesh's coarse fallback instead.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[SystemSettings]
; Foliage made of thousands of separate leaves keeps many Nanite clusters visible: the default buffer (4M) overflowed
; and dropped clusters (the crowns drew as shards).
r.Nanite.MaxVisibleClusters=16777216
