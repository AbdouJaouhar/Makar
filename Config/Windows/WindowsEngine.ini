[/Script/Engine.RendererSettings]
; Nanite foliage: the baked plants (Scripts/bake_flora.py) are simplified into voxels in the distance instead of
; thinning out. Here rather than in DefaultEngine.ini, which is kept out of the repository.
r.Nanite.AllowVoxels=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Nanite (the baked flora) needs Shader Model 6: on SM5 the engine draws every Nanite mesh's coarse fallback instead.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[SystemSettings]
; Foliage made of thousands of separate leaves keeps many Nanite clusters visible: the default buffer (4M) overflowed
; and dropped clusters (the crowns drew as shards).
r.Nanite.MaxVisibleClusters=16777216
; The sky light recaptures the sky with its clouds continuously (1.7 ms): fewer cloud samples in that blurred capture.
r.VolumetricCloud.ReflectionRaySampleMaxCount=24
; Swaying foliage redraws its shadow pages every frame. Animate the shadows only in the clipmap levels within each plant's
; WPO disable distance (80 m; default: 3 levels further, i.e. ~640 m, the whole island): ~3 ms of shadow depths less.
r.Shadow.Virtual.Clipmap.WPODisableDistance.LodBias=0
; Shadows, global illumination and reflections at the "High" level of BaseScalability.ini, Lumen's 60 fps target
; (Epic is its 30 fps one): in the forest 45 -> 24 ms of GPU (shadows 22 -> 6 ms, the virtual shadow map pages a
; third as fine), no visible difference. Spelt out: sg.* set here is read but does not apply its group.
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.0
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=1.0
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
r.Shadow.Virtual.MarkCoarsePagesLocal=2
r.DistanceFieldAO=1
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
