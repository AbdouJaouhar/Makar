[Windows DeviceProfile]
; Render at 67 % of the display resolution and let NVIDIA DLSS (Plugins/DLSS, "Quality" mode) reconstruct it: the swaying
; palm leaflets stay sharp (TSR at that resolution smeared them, which is why this was 100 %), for 10-25 % of GPU time.
; Without an NVIDIA RTX card r.NGX.DLSS.Enable does nothing and TSR upscales instead.
+CVars=r.ScreenPercentage.Default.Desktop.Mode=0
+CVars=r.ScreenPercentage.Default=67
+CVars=r.ScreenPercentage=67
+CVars=r.NGX.DLSS.Enable=1
