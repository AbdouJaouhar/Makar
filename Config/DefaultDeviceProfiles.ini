[Windows DeviceProfile]
; Render at the display resolution: the default (based on the display) rendered 1080p at about 67 % and let TSR
; upscale it, which blurred the sand ripples, the grass and the leaves.
+CVars=r.ScreenPercentage.Default.Desktop.Mode=0
+CVars=r.ScreenPercentage.Default=100
+CVars=r.ScreenPercentage=100
